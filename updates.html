        <nav class="site-nav" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="index.html#contact">Contact</a>
        </nav>

        <button
          id="theme-toggle"
          class="theme-toggle"
          type="button"

            <svg viewBox="0 0 24 24" width="20" height="20">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2"></path>
              <path d="M12 20v2"></path>

              <path d="M17.66 6.34l1.41-1.41"></path>

          </span>

          <span class="icon-moon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
            </svg>

    </div>

      <h1>Selected Updates</h1>

      <div class="updates-list">
        <!-- Add new entries below this comment, newest first. Remove the empty state once the first entry is added. -->
        <!--
        <article class="update-entry">

          <p>One or two lines describing the update.</p>
        </article>
        -->
        <p class="updates-empty">No updates yet.</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">

  </footer>

  <script src="script.js"></script>
